<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="点点减脂">
<meta name="theme-color" content="#16a085">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2316a085'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='white'%3E%E7%82%B9%3C/text%3E%3C/svg%3E">
<title>点点减脂打卡</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#1d2b29;--sub:#6b7b78;--pri:#16a085;--pri2:#e6f6f2;--line:#e3eae8;--ok:#1e9e5a;--warn:#e08a00;--bad:#d64545;--sh:0 1px 3px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#10171a;--card:#1a2427;--tx:#e8f0ee;--sub:#92a5a1;--pri:#2cc1a1;--pri2:#1b3a35;--line:#2a3639;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header h1{font-size:17px;margin:0;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.nav button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:8px;width:34px;height:30px;font-size:16px}
.nav .d{text-align:center;font-size:14px}.nav .d b{font-size:16px}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:400;color:var(--sub);font-size:12px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{border-radius:10px;padding:8px 2px;text-align:center;background:var(--bg);font-size:12px;color:var(--sub)}
.chip b{display:block;font-size:15px;color:var(--tx)}.chip.ok{background:var(--pri2)}.chip.ok b{color:var(--ok)}
.chip.bad b{color:var(--bad)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;color:#fff;background:var(--sub)}
.badge.ok{background:var(--ok)}.badge.warn{background:var(--warn)}
.meal{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0}
.cb{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.on>.cb,.cb.on{background:var(--pri);border-color:var(--pri)}
.meal .t{flex:1;min-width:0}.meal .t b{font-size:14px}.meal .t span{color:var(--sub);font-size:12px}
.meal p{margin:2px 0 0;font-size:13px;color:var(--tx)}
.meal .k{width:64px;flex:none;text-align:right}
input[type=number],input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px;background:var(--bg);color:var(--tx);font-family:inherit}
.k input{padding:6px;text-align:right;font-size:14px}
.row{display:flex;gap:10px}.row>div{flex:1}
label{font-size:12px;color:var(--sub);display:block;margin:0 0 3px}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px;transition:width .3s}
.water{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.wn{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;color:var(--sub)}
.wn b{display:block;color:var(--tx);font-size:13px}.wn.on{background:var(--pri);border-color:var(--pri);color:#fff}.wn.on b{color:#fff}
.btn{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px}
.btn.g{background:var(--pri2);color:var(--pri)}
.btn.r{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.tl{position:relative;padding-left:16px;border-left:2px solid var(--line);margin-left:6px}
.tl>div{position:relative;padding:0 0 12px 8px}
.tl>div:before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.tl b{font-size:13px}.tl span{display:block;font-size:12px;color:var(--sub)}
.tl .now:before{box-shadow:0 0 0 4px var(--pri2)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--sub);font-size:11px}
.tabbar button i{display:block;font-style:normal;font-size:20px;line-height:1.2}
.tabbar button.on{color:var(--pri);font-weight:600}
.pg{display:none}.pg.on{display:block}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{font-size:14px;font-weight:600;list-style:none;cursor:pointer;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}summary:after{content:"›";transform:rotate(90deg);color:var(--sub)}
details[open] summary:after{transform:rotate(-90deg)}
.sm{font-size:13px;color:var(--sub);white-space:pre-line}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.gd{aspect-ratio:1;border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub);border:1.5px solid transparent}
.gd b{font-size:13px;color:var(--tx)}.gd.ok{background:var(--ok)}.gd.ok b,.gd.ok{color:#fff}
.gd.part{background:#f7d58b}.gd.part b{color:#5a3d00}.gd.today{border-color:var(--pri)}
.gd.fut{opacity:.45}
.wk{font-size:11px;color:var(--sub);text-align:center}
.exc{border-left:4px solid var(--pri);padding:8px 10px;background:var(--pri2);border-radius:8px;margin-bottom:8px}
.exc b{font-size:15px}.exc .m{font-size:13px;color:var(--sub);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}th{color:var(--sub);font-weight:500}
.warn{background:#fff4e0;color:#7a4b00;border-radius:10px;padding:10px;font-size:12px}
@media(prefers-color-scheme:dark){.warn{background:#3a2e12;color:#f2cf8a}.gd.part{background:#7a5c14}.gd.part b{color:#ffe7ad}}
.shopi{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.shopi:first-of-type{border-top:0}
.shopi .t{flex:1;min-width:0}.shopi .t b{font-size:14px}
.shopi.done .t b{text-decoration:line-through;color:var(--sub)}
.shopi .q{text-align:right;flex:none;font-size:12px;color:var(--sub);max-width:42%}.shopi .q b{display:block;font-size:13px;color:var(--tx)}
.tag{display:inline-block;font-size:10px;padding:0 6px;border-radius:99px;background:#fff0d6;color:#8a5200;margin-left:4px;vertical-align:1px}
@media(prefers-color-scheme:dark){.tag{background:#4a3811;color:#f2cf8a}}
.alt{font-size:12px;color:var(--warn);margin-top:2px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;display:none;z-index:9}
</style>
</head>
<body>
<header>
 <h1>点点减脂打卡 · 8周计划</h1>

<main>

const START_DEFAULT='2026-11-01', N=56, WATER_ML=[300,300,300,300,300,300,600,200];
const KEY='dd_fatloss_v1';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{start:START_DEFAULT,days:{}};
S.shop=S.shop||{};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const WD=['周日','周一','周二','周三','周四','周五','周六'];
let cur=fmt(new Date());
const idxOf=ds=>diff(ds,S.start); // 0-based plan day
const wIdx=ds=>(parse(ds).getDay()+6)%7; // Mon=0
function rec(ds){
  if(!S.days[ds]) S.days[ds]={w:'',meals:[0,0,0,0],kc:[null,null,null,null],steps:'',exMin:'',exType:'',wn:[0,0,0,0,0,0,0,0],wx:0,note:''};
  return S.days[ds];
}
function calc(ds){
  const r=S.days[ds]; const i=idxOf(ds);
  const tgt=(i>=0&&i<N)?D.tgt[i]:null; const dd=D.days[wIdx(ds)];
  let kcal=0,any=false;
  if(r){r.meals.forEach((m,j)=>{if(m){any=true;kcal+=(r.kc[j]!=null&&r.kc[j]!==''?+r.kc[j]:dd.meals[j].k)}});}
  const water=r?r.wn.reduce((a,b,j)=>a+(b?WATER_ML[j]:0),0)+(+r.wx||0):0;
  const steps=r?(+r.steps||0):0, mins=r?(+r.exMin||0):0;
  const chk={kcal:any&&kcal>=1200&&kcal<=1450,steps:steps>=9000,ex:tgt!=null&&mins>=tgt,water:water>=2600};
  const n=Object.values(chk).filter(Boolean).length;
  return {kcal,any,water,steps,mins,tgt,chk,n,full:n===4};
}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1400)}
function phaseOf(i){return i<14?['阶段1 适应期','第1-2周']:i<42?['阶段2 稳降期','第3-6周']:['阶段3 收尾期','第7-8周']}
function head(){
  const i=idxOf(cur);
  let t=`<b>${cur.slice(5).replace('-','月')}日 ${WD[parse(cur).getDay()]}</b>`;
  if(i>=0&&i<N) t+=`<br>第${Math.floor(i/7)+1}周 · 第${i+1}/${N}天 · ${phaseOf(i)[0]}`;
  else if(i<0) t+=`<br>距计划开始还有 ${-i} 天`; else t+='<br>8周计划已结束';
  $('#hd').innerHTML=t;
}

  h+=`<div class="card"><h2>今日时间轴</h2><div class="tl">${D.line.map(l=>`<div data-t="${l[0]}"><b>${l[0]} ${l[1]}</b><span>${l[2]}</span></div>`).join('')}</div></div>`;

  $('#p-today').innerHTML=h;

  // highlight current time node
  if(cur===fmt(new Date())){const now=new Date(),nm=now.getHours()*60+now.getMinutes();let best=null;

function bindToday(){
  const r=rec(cur);
  const live=()=>{head();const c=calc(cur);S.days[cur]=r;save()};
  const bindIn=(id,key)=>{const e=$(id);if(e)e.addEventListener('change',()=>{r[key]=e.value;save();renderToday()})};
  bindIn('#in-w','w');bindIn('#in-steps','steps');bindIn('#in-exmin','exMin');
  const nt=$('#in-extype');nt.addEventListener('change',()=>{r.exType=nt.value;save()});
  const nn=$('#in-note');nn.addEventListener('change',()=>{r.note=nn.value;save()});
  document.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>{r.meals[+e.dataset.m]^=1;save();renderToday()});
  document.querySelectorAll('[data-k]').forEach(e=>e.addEventListener('change',()=>{r.kc[+e.dataset.k]=e.value===''?null:+e.value;save();renderToday()}));
  document.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{r.wn[+e.dataset.w]^=1;save();renderToday()});
  const wx=$('#wx');let lp;

  wx.ontouchend=wx.ontouchmove=()=>clearTimeout(lp);
  const f=$('#fillex');if(f)f.onclick=()=>{r.exMin=calc(cur).tgt;if(!r.exType)r.exType=D.ex[wIdx(cur)][1].split('（')[0];save();renderToday();toast('已记录运动')};

  const off=(parse(S.start).getDay()+6)%7;h+='<div></div>'.repeat(off);
  for(let i=0;i<N;i++){const ds=addDays(S.start,i),c=S.days[ds]?calc(ds):null;
    h+=`<div class="gd ${c&&c.full?'ok':c&&c.any&&c.n>0?'part':''} ${ds===today?'today':''} ${ds>today?'fut':''}" data-go="${ds}"><b>${i+1}</b>${ds.slice(5)}</div>`}
  h+=`</div></div>`;
  h+=`<div class="card"><h2>路线图</h2>${D.road.map(r=>`<details><summary>${r[0]} · ${r[2]}kg</summary><div class="sm" style="color:var(--tx)">${r[1].replace(/\n/g,' ')}\n${r[3]}</div></details>`).join('')}</div>`;
  h+=`<div class="card"><h2>健康提醒</h2><div class="warn">${D.tips}</div></div>`;
  h+=`<div class="card"><h2>数据与设置</h2>
   <label>计划开始日期</label><input type="date" id="in-start" value="${S.start}">
   <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn g" id="exp">导出备份</button><button class="btn g" id="csv">导出CSV</button><button class="btn g" id="imp">导入备份</button><button class="btn r" id="clr">清空数据</button></div>
   <input type="file" id="file" accept=".json" style="display:none">
   <div class="sm" style="margin-top:8px">数据只保存在本机浏览器，不会上传。换手机或清理浏览器前请先“导出备份”。iPhone：Safari → 分享 → 添加到主屏幕，就能像App一样打开。</div></div>`;
  $('#p-trend').innerHTML=h;
  document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{cur=e.dataset.go;go('today')});
  $('#in-start').onchange=e=>{if(e.target.value){S.start=e.target.value;save();renderAll();toast('已更新开始日期')}};
  $('#exp').onclick=()=>dl('点点减脂备份_'+today+'.json',JSON.stringify(S),'application/json');
  $('#csv').onclick=()=>{let t='\ufeff日期,体重kg,早餐,午餐,加餐,晚餐,总摄入kcal,步数,运动分钟,运动类型,饮水ml,达标,备注\n';
    for(let i=0;i<N;i++){const ds=addDays(S.start,i),r=S.days[ds];if(!r)continue;const c=calc(ds),dd=D.days[wIdx(ds)];
      const mk=j=>r.meals[j]?(r.kc[j]!=null?r.kc[j]:dd.meals[j].k):'';
      t+=[ds,r.w,mk(0),mk(1),mk(2),mk(3),c.any?c.kcal:'',r.steps,r.exMin,r.exType,c.water,c.full?'达标':'加油','"'+(r.note||'').replace(/"/g,'""')+'"'].join(',')+'\n'}
    dl('点点减脂打卡_'+today+'.csv',t,'text/csv')};
  $('#imp').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.days)throw 0;S=o;S.shop=S.shop||{};save();renderAll();toast('导入成功')}catch(_){toast('文件格式不对')}})};
  $('#clr').onclick=()=>{if(confirm('确定清空所有打卡记录？此操作不可恢复，建议先导出备份。')){S={start:S.start,days:{},shop:S.shop||{}};save();renderAll()}};
}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function go(p){document.querySelectorAll('.pg').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));
  document.querySelectorAll('.tabbar button').forEach(e=>e.classList.toggle('on',e.dataset.p===p));
  $('.nav').style.display=p==='today'?'flex':'none';renderAll();window.scrollTo(0,0)}
function renderAll(){head();renderToday();renderPlan();renderShop();renderTrain();renderTrend()}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.p));
$('#prev').onclick=()=>{cur=addDays(cur,-1);renderAll()};
$('#next').onclick=()=>{cur=addDays(cur,1);renderAll()};
renderAll();
</script>
</body>
</html>
